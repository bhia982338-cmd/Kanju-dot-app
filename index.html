<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanju App</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
.reels{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100vh;position:relative;scroll-snap-align:start}
video{width:100%;height:100%;object-fit:cover}
.right{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:20px}
.btn{background:none;border:none;color:#fff;font-size:28px;text-align:center}
.btn span{font-size:12px;display:block}
.bottom{position:absolute;bottom:20px;left:10px}
.follow{background:#ff0050;border:none;color:#fff;padding:5px 15px;border-radius:5px}
</style>
</head>
<body>
<div class="reels">
<div class="reel">
<video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted></video>
<div class="right">
<button class="btn" onclick="this.style.color='red'">❤️<span>12K</span></button>
<button class="btn">💬<span>340</span></button>
<button class="btn">↗️<span>Share</span></button>
</div>
<div class="bottom">
<b>@kanju_user</b> <button class="follow" onclick="this.innerText='Following'">Follow</button>
<p>Meri pehli reel #kanju</p>
<p>👁️ 45K Views</p>
</div>
</div>
</div>
</body>
</html>
